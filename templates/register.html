{% extends 'base.html' %}
{% block title %}Create your diary{% endblock %}
{% block content %}
<section class="auth-card"><a class="brand auth-brand" href="{{ url_for('register') }}"><span class="brand-flower" aria-hidden="true">✿</span><span>sakura <i>blooms</i></span></a><p class="eyebrow">A LITTLE SPACE, JUST FOR YOU</p><h1>Let’s <em>begin.</em></h1><p class="auth-copy">Create a private diary for your cycle and check-ins.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field"><span>Your name</span><input type="text" name="name" maxlength="80" autocomplete="name" required value="{{ request.form.get('name', '') }}"></label><label class="field"><span>Email address</span><input type="email" name="email" autocomplete="email" required value="{{ request.form.get('email', '') }}"></label><label class="field"><span>Password <small>(8 characters or more)</small></span><input type="password" name="password" minlength="8" autocomplete="new-password" required></label><button class="button button-primary button-full" type="submit">Create my diary <span aria-hidden="true">↗</span></button></form><p class="auth-switch">Already have a diary? <a href="{{ url_for('login') }}">Log in</a></p><div class="auth-decoration" aria-hidden="true">✿ <span>✿</span> ✿</div></section>
{% endblock %}
